<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neurodiverse AI MasterClass</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/brain-header.css">
  <link rel="stylesheet" href="css/aurora-backdrop.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Outfit:wght@400;500;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <!-- Sub-page fonts: Inter (body fallback on older pages) + JetBrains Mono (code blocks) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* === SPA Shell — ONLY layout, nothing else === */
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0B0910;color:#F5EADC;font-family:'Source Sans 3','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .spa-shell{display:flex;height:100vh;height:100dvh;width:100%}

    /* Sidebar — editorial side rail */
    .spa-sidebar{width:280px;min-width:280px;background:#0E0A14;border-right:1px solid rgba(245,234,220,.06);display:flex;flex-direction:column;overflow:hidden;transition:margin-left .3s ease,opacity .3s ease}
    .spa-sidebar.collapsed{margin-left:-280px;opacity:0;pointer-events:none}
    .sidebar-header{padding:24px 20px 16px 56px;border-bottom:1px solid rgba(245,234,220,.06);flex-shrink:0}
    .sidebar-header h1{font-family:'Fraunces',Georgia,serif;font-size:1.15rem;font-weight:500;color:#F5EADC;margin:0;display:flex;align-items:center;gap:10px;letter-spacing:-.01em;font-variation-settings:"opsz" 48}
    .sidebar-header p{font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:.78rem;color:rgba(245,234,220,.5);margin:8px 0 0;font-variation-settings:"opsz" 9}
    .sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
    .sidebar-nav::-webkit-scrollbar{width:4px}
    .sidebar-nav::-webkit-scrollbar-thumb{background:rgba(245,197,66,.15);border-radius:2px}
    .nav-section{
      padding:18px 20px 6px;font-family:'Outfit',sans-serif;
      font-size:.62rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
      color:#F5C542;opacity:.8;
    }
    .nav-item{
      display:flex;align-items:center;gap:10px;padding:8px 20px;
      font-size:.86rem;color:rgba(245,234,220,.72);text-decoration:none;cursor:pointer;
      transition:background .15s ease,color .15s ease,border-color .15s ease;
      border:none;border-left:2px solid transparent;background:none;width:100%;text-align:left;font-family:inherit;
    }
    .nav-item:hover{background:rgba(245,197,66,.04);color:#F5EADC;border-left-color:rgba(245,197,66,.3)}
    .nav-item.active{background:rgba(245,197,66,.06);color:#F5C542;font-weight:600;border-left-color:#F5C542}
    .nav-item .nav-icon{font-size:.95rem;width:22px;text-align:center;flex-shrink:0;opacity:.85}
    .nav-item .nav-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* Main content area — scrollable */
    .spa-main{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;background:transparent}
    .spa-main::-webkit-scrollbar{width:6px}
    .spa-main::-webkit-scrollbar-thumb{background:rgba(245,197,66,.18);border-radius:3px}
    #content-area{min-height:100%;opacity:1;transition:opacity .2s ease;position:relative;z-index:1}
    #content-area.loading{opacity:.3}

    /* Loader */
    .spa-loader{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10}
    .spa-loader.active{display:block}
    .spinner{width:40px;height:40px;border:3px solid rgba(245,197,66,.15);border-top-color:#F5C542;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Sidebar toggle */
    .sidebar-toggle{position:fixed;top:10px;left:10px;z-index:100;width:40px;height:40px;border-radius:8px;border:1px solid rgba(245,234,220,.08);background:rgba(14,10,20,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:rgba(245,234,220,.72);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:background .15s ease,border-color .15s ease,color .15s ease}
    .sidebar-toggle:hover{background:rgba(245,197,66,.08);border-color:rgba(245,197,66,.3);color:#F5C542}

    /* === SPA Content Fixes === */
    /* Hide standalone nav-bar (SPA has sidebar) */
    #content-area .nav-bar{display:none}
    #content-area .nav-footer .nav-link{cursor:pointer}
    #content-area pre{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word;max-width:100%}

    /* Brain header: STICKY — pins at top, content slides over it */
    /* (position:sticky comes from brain-header.css — we do NOT override it) */

    /* Content flows over sticky brain header — transparent so animation shows through */
    #content-area .page,
    #content-area .page-wrapper{position:relative;z-index:10}

    /* Show brain header h1 (design-system.css hides all h1) */
    #content-area .brain-header-text h1{display:block !important;opacity:1 !important;transform:none !important}

    /* Brain header text: visible initially, fades when .hidden class applied on scroll */
    #content-area .brain-header-text .tagline,
    #content-area .brain-header-text .pill{opacity:1;transform:none}
    #content-area .brain-header-text.hidden .tagline,
    #content-area .brain-header-text.hidden .pill,
    #content-area .brain-header-text.hidden h1{opacity:0 !important;transition:opacity 0.4s ease}

    /* Force content visibility (override fadeUp animation delays) */
    #content-area h2,#content-area h3,#content-area p,#content-area .callout,
    #content-area details,#content-area pre,#content-area ul,#content-area ol,
    #content-area blockquote,#content-area .c,#content-area .hero,
    #content-area .hero-icon,#content-area .hero-tagline,#content-area .hero-pill{
      opacity:1 !important;transform:none !important;
    }

    /* Responsive — at <=768px sidebar becomes overlay-mode (fixed, slides in over content).
       Initial collapsed state is set by spa-router.js on load (so JS owns open/close state). */
    @media(max-width:768px){
      .spa-sidebar{position:fixed;top:0;left:0;bottom:0;z-index:50;box-shadow:4px 0 20px rgba(0,0,0,.5)}
      .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:49}
      .sidebar-overlay.active{display:block}
      .sidebar-toggle{box-shadow:0 4px 12px rgba(0,0,0,.4)}
    }
  </style>
</head>
